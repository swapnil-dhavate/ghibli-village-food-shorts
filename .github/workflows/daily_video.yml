name: Daily Ghibli Village Food Short

on:
  schedule:
    - cron: "30 3 * * *"   # 03:30 UTC = 09:00 IST daily -- adjust to taste (cron is always UTC)
  workflow_dispatch:        # lets you trigger a run manually from the Actions tab
    inputs:
      skip_upload:
        description: "Build the video but don't publish to YouTube (for testing changes)"
        type: boolean
        default: false
      privacy_override:
        description: "Override youtube_privacy_status for this run only (blank = use config.json's default)"
        type: choice
        options: ["", "unlisted", "private", "public"]
        default: ""

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (pick dish -> story -> images -> video -> upload)
        working-directory: scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SKIP_YOUTUBE_UPLOAD: ${{ (github.event_name == 'workflow_dispatch' && inputs.skip_upload) && '1' || '' }}
          YOUTUBE_PRIVACY_OVERRIDE: ${{ (github.event_name == 'workflow_dispatch' && inputs.privacy_override) || '' }}
        run: python run_pipeline.py

      - name: Upload video as workflow artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-video-${{ github.run_id }}
          path: work/
          retention-days: 14

      - name: Commit updated dish rotation state
        run: |
          git config user.name "ghibli-village-bot"
          git config user.email "actions@github.com"
          git add data/state/used_dishes.json
          git diff --cached --quiet || git commit -m "chore: update dish rotation state [skip ci]"
          git push
